<div class="flex w-full flex-col items-center">
  <div class="w-full max-w-7xl pt-6">
    <h2 class="self-start text-xl font-bold text-black dark:text-white">
      Manage My Food
    </h2>
  </div>

  <div
    class="flex w-full max-w-7xl flex-wrap justify-center gap-3 pt-6 sm:flex-nowrap sm:justify-between"
  >
    <app-search-bar
      class="h-10 w-75 sm:w-90"
      [placeholderMessage]="'Filter my food...'"
    ></app-search-bar>
    <button
      class="cursor-pointer rounded-xl bg-green-500 px-4 py-2 text-white hover:bg-green-600 dark:bg-green-600 dark:hover:bg-green-500"
    >
      New Custom Food
    </button>
  </div>

  <div class="mt-10 w-full max-w-7xl">
    <div
      class="dark:bg-shark-500 relative flex justify-start overflow-hidden rounded-lg bg-gray-200"
    >
      <div
        class="absolute bottom-0 left-0 h-1 bg-green-500 transition-all duration-300"
        [ngStyle]="{
          width: 100 / 3 + '%',
          transform: 'translateX(' + selectedIndex * 100 + '%)',
        }"
      ></div>

      @for (
        tab of ["Favorites", "Recently Added", "All My Food"];
        track $index
      ) {
        <button
          class="hover:bg-green-10 flex-1 cursor-pointer px-4 py-2 text-center font-semibold focus:outline-none dark:hover:bg-green-600 dark:hover:text-white"
          (click)="selectTab($index)"
        >
          {{ tab }}
        </button>
      }
    </div>
    <div class="relative mt-3 max-h-150 overflow-hidden">
      <div
        class="flex transition-transform duration-500"
        [ngStyle]="{
          transform: 'translateX(-' + selectedIndex * 100 + '%)',
        }"
      >
        <div
          class="flex max-h-150 w-full max-w-7xl flex-shrink-0 flex-col overflow-y-auto p-4"
        >
          @for (favorite of favorites; track favorite.id) {
            <div
              class="grid grid-cols-12 border-b border-gray-200 dark:border-gray-600"
            >
              <app-food-card
                [food]="favorite"
                class="col-span-10 grid w-full grid-cols-subgrid"
              />
              <div
                class="col-span-2 flex w-full items-center justify-center p-4"
              >
                <span
                  class="rounded-full p-2 hover:cursor-pointer hover:bg-green-100 dark:hover:bg-green-600 dark:hover:text-white"
                >
                  <i class="iconify text-2xl" data-icon="mdi:heart-outline"></i>
                </span>
                <span
                  class="rounded-full p-2 hover:cursor-pointer hover:bg-green-100 dark:hover:bg-green-600 dark:hover:text-white"
                >
                  <i
                    class="iconify text-2xl"
                    data-icon="material-symbols:edit-outline"
                  ></i>
                </span>
                <span
                  class="rounded-full p-2 hover:cursor-pointer hover:bg-green-100 dark:hover:bg-green-600 dark:hover:text-white"
                >
                  <i
                    class="iconify text-2xl"
                    data-icon="material-symbols:delete-outline"
                  ></i>
                </span>
              </div>
            </div>
          }
        </div>
        <div
          class="flex max-h-150 w-full max-w-7xl flex-shrink-0 flex-col overflow-y-auto p-4"
        >
          @for (recentOne of recent; track recentOne.id) {
            <div
              class="grid grid-cols-12 border-b border-gray-200 dark:border-gray-600"
            >
              <app-food-card
                [food]="recentOne"
                class="col-span-10 grid w-full grid-cols-subgrid"
              />
              <div
                class="col-span-2 flex w-full items-center justify-center p-4"
              >
                <span
                  class="rounded-full p-2 hover:cursor-pointer hover:bg-green-100 dark:hover:bg-green-600 dark:hover:text-white"
                >
                  <i class="iconify text-2xl" data-icon="mdi:heart-outline"></i>
                </span>
                <span
                  class="rounded-full p-2 hover:cursor-pointer hover:bg-green-100 dark:hover:bg-green-600 dark:hover:text-white"
                >
                  <i
                    class="iconify text-2xl"
                    data-icon="material-symbols:edit-outline"
                  ></i>
                </span>
                <span
                  class="rounded-full p-2 hover:cursor-pointer hover:bg-green-100 dark:hover:bg-green-600 dark:hover:text-white"
                >
                  <i
                    class="iconify text-2xl"
                    data-icon="material-symbols:delete-outline"
                  ></i>
                </span>
              </div>
            </div>
          }
        </div>
        <div
          class="flex max-h-150 w-full max-w-7xl flex-shrink-0 flex-col overflow-y-auto p-4"
        >
          @for (food of allMyFood; track food.id) {
            <div
              class="grid grid-cols-12 border-b border-gray-200 dark:border-gray-600"
            >
              <app-food-card
                [food]="food"
                class="col-span-10 grid w-full grid-cols-subgrid"
              />
              <div
                class="col-span-2 flex w-full items-center justify-center p-4"
              >
                <span
                  class="rounded-full p-2 hover:cursor-pointer hover:bg-green-100 dark:hover:bg-green-600 dark:hover:text-white"
                >
                  <i class="iconify text-2xl" data-icon="mdi:heart-outline"></i>
                </span>
                <span
                  class="rounded-full p-2 hover:cursor-pointer hover:bg-green-100 dark:hover:bg-green-600 dark:hover:text-white"
                >
                  <i
                    class="iconify text-2xl"
                    data-icon="material-symbols:edit-outline"
                  ></i>
                </span>
                <span
                  class="rounded-full p-2 hover:cursor-pointer hover:bg-green-100 dark:hover:bg-green-600 dark:hover:text-white"
                >
                  <i
                    class="iconify text-2xl"
                    data-icon="material-symbols:delete-outline"
                  ></i>
                </span>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
