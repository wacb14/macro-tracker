<div class="flex w-full flex-col items-center">
  <form
    class="flex w-full max-w-3xl flex-col gap-y-5 pt-4 lg:w-150"
    [formGroup]="passwordForm"
    (ngSubmit)="sendForm()"
  >
    <div class="flex flex-row items-center justify-start">
      <button class="btn-icon" type="button" (click)="navigateBack()">
        <i class="iconify text-2xl" data-icon="famicons:arrow-back-sharp"></i>
      </button>
      <h1 class="p-2 text-xl font-bold text-black dark:text-white">Password</h1>
    </div>

    <label
      class="text-md font-bold text-black dark:text-white"
      for="currentPassword"
    >
      Current Password
    </label>
    <app-password-input
      id="currentPassword"
      formControlName="currentPassword"
      placeholder="Enter Your Current Password"
    />

    <label
      class="text-md font-bold text-black dark:text-white"
      for="newPassword"
    >
      New Password
    </label>
    <app-password-input
      id="newPassword"
      formControlName="newPassword"
      placeholder="Enter Your New Password"
    />

    <label
      class="text-md font-bold text-black dark:text-white"
      for="confirmPassword"
    >
      Confirm Your Password
    </label>
    <app-password-input
      id="confirmPassword"
      formControlName="confirmPassword"
      placeholder="Confirm Your New Password"
    />

    <div class="flex flex-row gap-4 pt-4">
      <button class="btn-secondary w-full" type="button">Cancel</button>
      <button class="btn-primary w-full" type="submit">Save</button>
    </div>
  </form>
</div>
