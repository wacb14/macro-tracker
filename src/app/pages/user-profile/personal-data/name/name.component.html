<div class="flex w-full flex-col items-center">
  <form class="flex w-full lg:w-150 max-w-3xl flex-col gap-y-5 pt-4">
    <div class="flex flex-row items-center justify-start">
      <button
        class="btn-icon"
        type="button"
        (click)="navigateBack()"
      >
        <i class="iconify text-2xl" data-icon="famicons:arrow-back-sharp"></i>
      </button>

      <h1 class="p-2 text-xl font-bold text-black dark:text-white">
        User Name
      </h1>
    </div>
    <label class="text-md font-bold text-black dark:text-white"> Name </label>
    <input type="text" class="input-primary" placeholder="Enter your name" />
    <label class="text-md font-bold text-black dark:text-white">
      Last Name
    </label>
    <input
      type="text"
      class="input-primary"
      placeholder="Enter your last name"
    />
    <div class="flex flex-row gap-4 pt-4">
      <button class="btn-secondary w-full" type="button">Cancel</button>
      <button class="btn-primary w-full" type="submit">Save</button>
    </div>
  </form>
</div>
