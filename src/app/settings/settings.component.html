<div class="w-full flex flex-col items-center">
  <div class="w-full max-w-5xl">
    <h1 class="text-xl font-bold text-black self-start">Settings</h1>
  </div>
  <form class="w-full max-w-5xl flex flex-col items-center">
    <div
      class="mt-6 flex flex-col w-full max-w-4xl border border-gray-300 rounded-2xl"
    >
      <h2 class="text-lg font-semibold text-black self-start p-4">
        App settings
      </h2>
      @for (field of settings; track $index) {
      <app-information-card
        [title]="field.title"
        [message]="field.placeholder"
        [content]="field.content"
        [lastCard]="$last"
      />
      @if(!$last){
      <hr class="border-gray-300" />
      } }
    </div>
  </form>
</div>
