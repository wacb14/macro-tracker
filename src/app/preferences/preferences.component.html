<div class="w-full flex flex-col items-center">
  <div class="w-full max-w-5xl">
    <h1 class="text-xl font-bold text-black self-start dark:text-white">Preferences</h1>
  </div>
  <form class="w-full max-w-5xl flex flex-col items-center">
    <div
      class="mt-6 flex flex-col w-full max-w-4xl border border-gray-300 rounded-2xl bg-white dark:bg-shark-500"
    >
      <h2 class="text-lg font-semibold text-black self-start p-4 dark:text-white">
        User Data
      </h2>
      @for (field of userData; track $index) {
      <app-information-card
        [title]="field.title"
        [message]="field.placeholder"
        [content]="field.content"
        [lastCard]="$last"
      />
      @if(!$last){
      <hr class="border-gray-300" />
      } }
    </div>
    <div
      class="mt-6 flex flex-col w-full max-w-4xl border border-gray-300 rounded-2xl bg-white dark:bg-shark-500"
    >
      <h2 class="text-lg font-semibold text-black self-start p-4 dark:text-white">
        Fitness Preferences
      </h2>
      @for (field of userPreferences; track $index) {
      <app-information-card
        [title]="field.title"
        [message]="field.placeholder"
        [content]="field.content"
        [lastCard]="$last"
      />
      @if(!$last){
      <hr class="border-gray-300" />
      } }
    </div>
  </form>
</div>
