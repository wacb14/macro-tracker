<div class="col-span-2 p-4 w-full flex items-center justify-center">
  <span class="bg-green-100 dark:bg-green-200 p-4 rounded-lg">
    <i class="iconify text-2xl text-green-500" [attr.data-icon]="food.icon"></i>
  </span>
</div>
<div class="col-span-8 p-4 w-full">
  <span class="font-semibold dark:text-white">{{ food.name }}</span
  ><br />
  <span class="text-gray-600 dark:text-stone-300"
    >Protein: {{ food.protein }}g | Carbs: {{ food.carbs }}g | Fats:
    {{ food.fats }}g | Calories: {{ food.calories }}kcal per {{food.portion}}g</span
  >
</div>
