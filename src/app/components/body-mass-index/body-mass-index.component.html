<div class="w-full flex flex-col items-center">
  <div class="w-full max-w-7xl">
    <h2 class="text-xl font-bold text-black self-start dark:text-white">
      Body Mass Index (BMI)
    </h2>
  </div>
  <div class="w-full max-w-4xl mt-5 p-4">
    <div
      class="p-6 max-w-4xl bg-green-50 rounded-xl shadow-md grid grid-cols-12 gap-2 items-center dark:bg-green-600"
    >
      <div class="col-span-12 md:col-span-4 flex flex-col items-center">
        <span class="bg-green-100 dark:bg-green-200 p-4 rounded-lg">
          <i
            class="iconify text-3xl text-green-500"
            data-icon="game-icons:weight-lifting-up"
          ></i>
        </span>
        <h3 class="text-lg font-bold text-black dark:text-white mt-2">Current BMI: 23.7</h3>
        <h4 class="text-md font-semibold text-black dark:text-white">Status: Balanced</h4>
        <h5 class="text-md font-semibold text-gray-500 dark:text-stone-100 max-w-md">
          Current Weight: 61.00kg
        </h5>
        <h5 class="text-md font-semibold text-gray-500 dark:text-stone-100 max-w-md">
          Ideal Weight: 62.30kg
        </h5>
      </div>
      <div class="col-span-12 md:col-span-8 flex flex-col items-center">
        <div class="max-w-md">
          <div class="mt-4 w-full rounded-full grid grid-cols-12 text-center">
            <div class="text-md text-gray-500 dark:text-white col-span-2 col-start-3">
              52.80
            </div>
            <div class="text-md text-gray-500 dark:text-white col-span-2 col-start-6">
              71.40
            </div>
            <div class="text-md text-gray-500 dark:text-white col-span-2 col-start-9">
              85.70
            </div>
          </div>
          <div
            class="w-full h-4 rounded-full grid grid-cols-4 relative items-center"
          >
            <div
              class="h-4 w-4 border-2 border-green-500 bg-white rounded-full absolute top-0 left-25"
            ></div>
            <div class="h-2 bg-blue-500 rounded-l-full"></div>
            <div class="h-2 bg-green-500"></div>
            <div class="h-2 bg-orange-500"></div>
            <div class="h-2 bg-red-500 rounded-r-full"></div>
          </div>
          <div class="w-full rounded-full grid grid-cols-4 text-center">
            <div class="text-md text-gray-500 dark:text-white">Underweight</div>
            <div class="text-md text-gray-500 dark:text-white">Balanced</div>
            <div class="text-md text-gray-500 dark:text-white">Overweight</div>
            <div class="text-md text-gray-500 dark:text-white">Obese</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
