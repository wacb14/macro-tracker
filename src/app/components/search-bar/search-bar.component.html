<div class="relative w-full h-full">
  <input
    type="text"
    [placeholder]="placeholderMessage"
    class="rounded-xl bg-gray-200 dark:bg-shark-500 px-5 w-full h-full focus:outline-none focus:ring-2 focus:ring-green-500"
  />
  <span
    class="p-1 rounded-full cursor-pointer absolute top-1 right-1 text-green-500 hover:bg-green-200 dark:hover:bg-green-600 hover:text-green-200"
  >
    <i
      class="iconify text-2xl"
      data-icon="ic:outline-search"
    ></i>
  </span>
</div>
