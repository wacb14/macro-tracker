<div class="relative w-full h-full">
  <input
    type="text"
    [placeholder]="placeholderMessage"
    class="rounded-xl bg-gray-200 px-5 w-full h-full focus:outline-none focus:ring-2 focus:ring-green-500"
  />
  <span
    class="p-1 rounded-full cursor-pointer absolute top-1 right-1 hover:bg-green-200"
  >
    <i
      class="iconify text-2xl text-green-500"
      data-icon="ic:outline-search"
    ></i>
  </span>
</div>
