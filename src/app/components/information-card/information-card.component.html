<div
  class="grid grid-cols-12 w-full p-4 hover:bg-green-100 cursor-pointer"
  [ngClass]="lastCard() ? 'rounded-b-xl' : ''"
>
  <div class="col-span-10 grid grid-cols-subgrid">
    <span class="col-span-10 sm:col-span-3 text-sm text-gray-800">{{
      title()
    }}</span>
    @if(content() != ""){
    <span class="col-span-10 sm:col-span-7 text-md">{{ content() }}</span>
    } @else {
    <span class="col-span-10 sm:col-span-7 text-md text-gray-700">{{
      message()
    }}</span>
    }
  </div>
  <div class="col-span-2 flex justify-end">
    <i class="iconify text-xl" data-icon="mingcute:right-fill"></i>
  </div>
</div>
