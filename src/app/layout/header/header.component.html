<div
  class="dark:bg-bunker-500 flex items-center justify-between bg-slate-50 p-3 dark:text-stone-300"
>
  <div class="flex items-center gap-4">
    <button
      class="btn-icon"
      (click)="toggleMenu()"
    >
      <i class="iconify text-xl" data-icon="solar:hamburger-menu-linear"></i>
    </button>
  </div>

  <div class="flex items-center gap-4">
    @if (getTheme() === "dark") {
      <button
        class="btn-icon"
        (click)="toggleTheme()"
      >
        <i class="iconify text-2xl" data-icon="line-md:moon-loop"></i>
      </button>
    } @else {
      <button
        class="btn-icon"
        (click)="toggleTheme()"
      >
        <i class="iconify text-2xl" data-icon="line-md:sunny-loop"></i>
      </button>
    }
    <app-notifications></app-notifications>
    <app-profile-menu></app-profile-menu>
  </div>
</div>
