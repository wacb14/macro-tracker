<div class="flex min-h-dvh">
  <!-- Sidebar -->
  <aside
    class="transition-all duration-300"
    [ngClass]="{
      'w-18': !isMobile && isHiddenMenu(),
      'w-64 md:w-55 lg:w-64': !isHiddenMenu() && !isMobile,
    }"
  >
    <nav class="flex h-full flex-col items-center">
      <app-sidebar
        [isMobile]="isMobile"
        [isHidden]="isHiddenMenu"
      ></app-sidebar>
    </nav>
  </aside>
  <!-- Main Content -->
  <div class="dark:bg-bunker-500 flex-1 bg-slate-50 dark:text-stone-300">
    <!-- Header -->
    <header class="sticky top-0 z-10">
      <app-header [isHiddenMenu]="isHiddenMenu"></app-header>
    </header>
    <main class="p-4 md:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
