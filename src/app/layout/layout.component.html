<div class="flex h-screen">
  <!-- Sidebar -->
  <aside
    class="transition-all duration-300"
    [ngClass]="{ 'w-18': !isMobile && isHiddenMenu(),
      'w-64': !isHiddenMenu() && !isMobile,
     }"
  >
    <nav class="flex flex-col h-full items-center">
      <app-sidebar
        [isMobile]="isMobile"
        [isHidden]="isHiddenMenu"
      ></app-sidebar>
    </nav>
  </aside>
  <!-- Main Content -->
  <div class="flex-1 bg-slate-50">
    <!-- Header -->
    <header class="sticky top-0 z-10">
      <app-header [isHiddenMenu]="isHiddenMenu"></app-header>
    </header>
    <main class="p-6 flex flex-col items-center">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
