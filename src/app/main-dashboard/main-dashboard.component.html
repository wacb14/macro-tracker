<div class="p-6 flex flex-col items-center">
  <h2 class="text-xl font-bold text-green-700 self-start">
    Welcome back, User! Ready to track today's macros?
  </h2>
  <div
    class="pt-6 w-full max-w-7xl"
  >
    <h1 class="text-2xl font-bold text-black self-start">Today's progress</h1>
  </div>
  <div
    class="pt-6 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3 w-full max-w-7xl"
  >
    <div class="bg-green-50 rounded-xl p-6 shadow-md w-full flex flex-row">
      <div class="flex flex-col justify-center w-70">
        <h2 class="text-xl font-semibold text-center text-blue-500">
          Protein
        </h2>
      </div>
      <div class="w-full flex flex-col items-center">
        <app-radial-progress-bar
          [progress]="75"
          [color]="'text-blue-500'"
        ></app-radial-progress-bar>
      </div>
    </div>
    <div class="bg-green-50 rounded-xl p-6 shadow-md w-full flex flex-row">
      <div class="flex flex-col justify-center w-70">
        <h2 class="text-xl font-semibold text-center text-purple-500">
          Carbs
        </h2>
      </div>
      <div class="w-full flex flex-col items-center">
        <app-radial-progress-bar
          [progress]="50"
          [color]="'text-purple-500'"
        ></app-radial-progress-bar>
      </div>
    </div>
    <div class="bg-green-50 rounded-xl p-6 shadow-md w-full flex flex-row">
      <div class="flex flex-col justify-center w-70">
        <h2 class="text-xl font-semibold text-center text-pink-500">
          Fats
        </h2>
      </div>
      <div class="w-full flex flex-col items-center">
        <app-radial-progress-bar
          [progress]="64"
          [color]="'text-pink-500'"
        ></app-radial-progress-bar>
      </div>
    </div>
    <div class="bg-green-50 rounded-xl p-6 shadow-md w-full flex flex-row">
      <div class="flex flex-col justify-center w-70">
        <h2 class="text-xl font-semibold text-center text-yellow-500">
          Calories
        </h2>
      </div>
      <div class="w-full flex flex-col items-center">
        <app-radial-progress-bar
          [progress]="21"
          [color]="'text-yellow-500'"
        ></app-radial-progress-bar>
      </div>
    </div>
  </div>
</div>
